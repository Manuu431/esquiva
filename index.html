<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0a0d18">
  <meta name="description" content="Esquiva: arcade de reflejos para 2-6 amigos, con bots entrenados por neuroevolución.">
  <title>Esquiva</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0d18'/%3E%3Ccircle cx='12' cy='19' r='7' fill='%2338e1ff'/%3E%3Ccircle cx='23' cy='9' r='5' fill='%23ff4d5e'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css?v=10">
</head>
<body>
  <div id="stage">
    <canvas id="canvas" width="800" height="600" aria-label="Arena de juego"></canvas>

    <div id="touch-hint" class="hidden">Arrastra el dedo para moverte</div>

    <section id="menu" class="overlay">
      <h1>ESQUIVA</h1>
      <p class="tagline">Esquiva. Coge estrellas. Suma más puntos que nadie.</p>

      <label class="field">
        <span>Tu nombre</span>
        <input id="name" type="text" maxlength="12" autocomplete="off" spellcheck="false" placeholder="Jugador">
      </label>

      <div class="panel">
        <h2>En este ordenador</h2>
        <div class="row four">
          <label class="field small">
            <span>Bots</span>
            <select id="bots">
              <option value="0">0</option>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3" selected>3</option>
              <option value="4">4</option>
              <option value="5">5</option>
            </select>
          </label>
          <label class="field small">
            <span>Nivel</span>
            <select id="level"></select>
          </label>
          <label class="field small">
            <span>Vidas</span>
            <select id="lives">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3" selected>3</option>
              <option value="4">4</option>
              <option value="5">5</option>
            </select>
          </label>
          <label class="field small">
            <span>Proyectiles</span>
            <select id="hazard">
              <option value="0">Suave</option>
              <option value="1" selected>Normal</option>
              <option value="2">Intensa</option>
            </select>
          </label>
        </div>
        <button id="btn-play" class="primary">Jugar</button>
        <p id="bots-note" class="note hidden"></p>
      </div>

      <div class="panel" id="panel-online">
        <h2>Con amigos (2-6)</h2>
        <div class="row">
          <button id="btn-host">Crear sala</button>
          <input id="code" type="text" maxlength="5" autocomplete="off" spellcheck="false" placeholder="CÓDIGO">
          <button id="btn-join">Unirse</button>
        </div>
        <p id="online-note" class="note"></p>
      </div>

      <p class="keys">Muévete con <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> o las flechas · <kbd>M</kbd> sonido</p>
      <p class="note"><span id="record"></span> <button id="btn-stats" class="tiny" type="button">Mis partidas</button></p>
    </section>

    <section id="stats" class="overlay wide hidden">
      <h2>Mis partidas</h2>

      <h3>Récords por modo</h3>
      <div id="stats-modes" class="table-wrap"></div>

      <h3>Todas las partidas</h3>
      <div class="row five">
        <label class="field small">
          <span>Dónde</span>
          <select id="f-where">
            <option value="">Todas</option>
            <option value="0">Local</option>
            <option value="1">En sala</option>
          </select>
        </label>
        <label class="field small">
          <span>Bots</span>
          <select id="f-bots">
            <option value="">Todos</option>
            <option value="0">0</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
          </select>
        </label>
        <label class="field small">
          <span>Nivel</span>
          <select id="f-level"></select>
        </label>
        <label class="field small">
          <span>Vidas</span>
          <select id="f-lives">
            <option value="">Todas</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
          </select>
        </label>
        <label class="field small">
          <span>Proyectiles</span>
          <select id="f-hazard">
            <option value="">Todos</option>
            <option value="0">Suave</option>
            <option value="1">Normal</option>
            <option value="2">Intensa</option>
          </select>
        </label>
      </div>
      <p id="stats-summary" class="summary"></p>
      <div id="stats-games" class="table-wrap tall"></div>

      <div class="row">
        <button id="btn-stats-close" class="primary" type="button">Volver</button>
        <button id="btn-stats-clear" class="ghost" type="button">Borrar registro</button>
      </div>
    </section>

    <section id="lobby" class="overlay hidden">
      <h2 id="lobby-title">Sala</h2>
      <p class="code-box"><span id="lobby-code">-----</span><button id="btn-copy" class="tiny">Copiar enlace</button></p>
      <ul id="lobby-players" class="players"></ul>
      <div class="row four" id="lobby-host-controls">
        <label class="field small">
          <span>Bots</span>
          <select id="lobby-bots">
            <option value="0" selected>0</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
          </select>
        </label>
        <label class="field small">
          <span>Nivel</span>
          <select id="lobby-level"></select>
        </label>
        <label class="field small">
          <span>Vidas</span>
          <select id="lobby-lives">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3" selected>3</option>
              <option value="4">4</option>
              <option value="5">5</option>
          </select>
        </label>
        <label class="field small">
          <span>Proyectiles</span>
          <select id="lobby-hazard">
              <option value="0">Suave</option>
              <option value="1" selected>Normal</option>
              <option value="2">Intensa</option>
          </select>
        </label>
      </div>
      <div class="row" id="lobby-start-row">
        <button id="btn-start" class="primary">Empezar</button>
      </div>
      <p id="lobby-status" class="note"></p>
      <button id="btn-leave" class="ghost">Salir</button>
    </section>

    <section id="gameover" class="overlay hidden">
      <h2 id="over-title">Fin de la ronda</h2>
      <ol id="over-list" class="players"></ol>
      <p id="over-note" class="note"></p>
      <div class="row">
        <button id="btn-again" class="primary">Otra ronda</button>
        <button id="btn-menu" class="ghost">Menú</button>
      </div>
    </section>

    <div id="corner">
      <button id="btn-mute" class="tiny" type="button">Sonido</button>
      <button id="btn-exit" class="tiny hidden" type="button">Salir</button>
    </div>

    <div id="toast" class="hidden"></div>
  </div>

  <script src="js/sim.js?v=10"></script>
  <script src="js/nn.js?v=10"></script>
  <script src="js/netcode.js?v=10"></script>
  <script src="js/stats.js?v=10"></script>
  <script src="js/vendor/peerjs.min.js?v=10"></script>
  <script src="js/net.js?v=10"></script>
  <script src="js/render.js?v=10"></script>
  <script src="js/input.js?v=10"></script>
  <script src="js/audio.js?v=10"></script>
  <script src="js/main.js?v=10"></script>
</body>
</html>
